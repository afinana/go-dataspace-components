version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dataspace-postgres
    environment:
      POSTGRES_DB: dataspace_identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Automatically initialize the PostgreSQL schema with Identity Hub tables
      - ./identity-hub/ports/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      # Automatically initialize the PostgreSQL schema with Catalog tables
      - ./catalog/ports/schema.sql:/docker-entrypoint-initdb.d/2-catalog-schema.sql
      # Automatically initialize the PostgreSQL schema with Control Plane tables
      - ./control-plane/ports/schema.sql:/docker-entrypoint-initdb.d/3-controlplane-schema.sql
      # Automatically initialize the PostgreSQL schema with Data Plane tables
      - ./data-plane/ports/schema.sql:/docker-entrypoint-initdb.d/4-dataplane-schema.sql
      # Automatically initialize the PostgreSQL schema with Consumer tables
      - ./consumer/ports/schema.sql:/docker-entrypoint-initdb.d/5-consumer-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataspace_identity"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity-hub:
    build:
      context: .
      dockerfile: docker/identity-hub.Dockerfile
    container_name: dataspace-identity-hub
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
      - SERVICE_NAME=identity-hub
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/dataspace_identity?sslmode=disable
    depends_on:
      postgres:
        condition: service_started

  control-plane:
    build:
      context: .
      dockerfile: docker/control-plane.Dockerfile
    container_name: dataspace-control-plane
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
      - SERVICE_NAME=control-plane
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/dataspace_identity?sslmode=disable
    depends_on:
      - identity-hub
      - postgres

  consumer-control-plane:
    build:
      context: .
      dockerfile: docker/consumer.Dockerfile
    container_name: dataspace-consumer-control-plane
    ports:
      - "8091:8091"
    environment:
      - PORT=8091
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
      - SERVICE_NAME=consumer-control-plane
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/dataspace_identity?sslmode=disable
      - PROVIDER_DSP_URL=http://control-plane:8081/api/dsp/2025-1
      - PROVIDER_ID=did:web:provider
      - CONSUMER_CALLBACK_URL=http://consumer-control-plane:8091/consumer
    depends_on:
      - identity-hub
      - postgres
      - control-plane

  consumer-data-plane:
    build:
      context: .
      dockerfile: docker/consumer-data-plane.Dockerfile
    container_name: dataspace-consumer-data-plane
    ports:
      - "8092:8092"
    environment:
      - PORT=8092
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
      - SERVICE_NAME=consumer-data-plane
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/dataspace_identity?sslmode=disable
    depends_on:
      - consumer-control-plane
      - postgres

  data-plane:
    build:
      context: .
      dockerfile: docker/data-plane.Dockerfile
    container_name: dataspace-data-plane
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
      - SERVICE_NAME=data-plane
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/dataspace_identity?sslmode=disable
    depends_on:
      - control-plane
      - postgres

  data-dashboard:
    build:
      context: .
      dockerfile: docker/data-dashboard.Dockerfile
    container_name: dataspace-data-dashboard
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
      - SERVICE_NAME=data-dashboard
    depends_on:
      - control-plane
      - data-plane
      - identity-hub

  oxigraph:
    image: oxigraph/oxigraph:latest
    container_name: dataspace-oxigraph
    ports:
      - "7878:7878"
    volumes:
      - oxidata:/data
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    container_name: dataspace-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/varz"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats-console:
    image: ghcr.io/nats-nui/nui:latest
    container_name: dataspace-nats-console
    ports:
      - "8085:8080"
    environment:
      - NATS_URLS=nats://nats:4222
    depends_on:
      - nats

volumes:
  pgdata:
    driver: local
  oxidata:
    driver: local

